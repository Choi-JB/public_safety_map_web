name: Keep Supabase Alive

on:
  schedule:
    # 매 3일마다 자정(UTC 기준)에 실행
    - cron: "0 0 */3 * *"
  # 수동으로 실행해볼 수 있도록 버튼 추가
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Send Dummy Message to Supabase
        run: |
          curl -X POST '${{ secrets.SUPABASE_URL }}/rest/v1/messages' \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "rooms_id": 1,
            "sender_id": "admin_id",
            "content": "서버 자동 활성화 메시지입니다.",
            "is_archived": "Y"
          }'